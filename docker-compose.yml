# 本地开发：Docker 仅提供 Nginx（HTTP 入口）+ MinIO（对象存储）
# MySQL、Redis、JVM 后端在宿主机运行（mvn spring-boot:run）
#
# 前端：须先构建 Vue 再 up（否则 8880 无 index.html）
#   cd front/dp_game && npm install && npm run build
#
# 使用：
#   docker compose up -d
#   本机起双实例：scripts/run-multi-instance.ps1 -DepsOnly 后另开终端跑 JVM
#   浏览器：http://localhost:8880/

services:
  minio:
    image: minio/minio:latest
    mem_limit: 256m
    cpus: "0.3"
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  nginx:
    image: nginx:alpine
    mem_limit: 64m
    cpus: "0.1"
    ports:
      - "8880:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./front/dp_game/dist:/usr/share/nginx/html:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - minio

volumes:
  minio_data:
