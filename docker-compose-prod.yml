# 云服务器部署用（docker compose -f docker-compose-prod.yml up -d）
# 直接复制到服务器上跑，别放项目里跟代码一起推

services:
  mysql:
    image: mysql:8.0
    mem_limit: 450m
    cpus: "0.5"
    # 与 app TZ / JDBC serverTimezone 对齐，避免 NOW()、TIMESTAMP 与业务时区不一致
    environment:
      MYSQL_ROOT_PASSWORD: mgdemo_root
      MYSQL_DATABASE: school_db
      TZ: Asia/Shanghai
    command: --default-time-zone='+08:00'
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pmgdemo_root || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  minio:
    image: minio/minio:latest
    mem_limit: 256m
    cpus: "0.3"
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    mem_limit: 64m
    cpus: "0.2"
    command: redis-server --appendonly yes --requirepass mgdemo_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "mgdemo_redis", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  nginx:
    image: 1933886418/dpgame-nginx:v1.0.1
    mem_limit: 64m
    cpus: "0.1"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app

  app: 
    image: 1933886418/dpgame:v1.0.1 
    mem_limit: 944m
    cpus: "0.9"
    ports:
      - "8088:8088"
    environment:
      # --- C: JVM / 时区 ---
      JAVA_OPTS: "-Xms256m -Xmx800m"
      TZ: Asia/Shanghai

      # --- C: 容器内上传路径（配合 volumes mgdemo_uploads:/data/mgdemo-files）---
      MGDEMOPLUS_IMAGES_FILE_LOCATION: file:/data/mgdemo-files/images/
      MGDEMOPLUS_MUSIC_FILE_LOCATION: file:/data/mgdemo-files/music/
      MGDEMOPLUS_FILES_FILE_LOCATION: file:/data/mgdemo-files/other/
      MGDEMOPLUS_TIME_ZONE: Asia/Shanghai

      # --- MinIO 对象存储（bucket 由 app 启动时自动创建）---
      MGDEMOPLUS_MINIO_ENABLED: ${MGDEMOPLUS_MINIO_ENABLED:-true}
      MGDEMOPLUS_MINIO_ENDPOINT: http://minio:9000
      MGDEMOPLUS_MINIO_ACCESS_KEY: ${MGDEMOPLUS_MINIO_ACCESS_KEY:-minioadmin}
      MGDEMOPLUS_MINIO_SECRET_KEY: ${MGDEMOPLUS_MINIO_SECRET_KEY:-minioadmin}
      MGDEMOPLUS_MINIO_BUCKET: ${MGDEMOPLUS_MINIO_BUCKET:-mgdemo}

      # --- C: Docker 网络内 JDBC / Redis（主机名 mysql / redis）---
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/school_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: mgdemo_root  # A：生产应换强口令
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: mgdemo_redis  # A

      # --- B: 运维可调（不填则用 application.yml 默认；按需取消注释）---
      MGDEMOPLUS_CACHE_MUSIC_LIST_TTL_SECONDS: "300"
      # MGDEMOPLUS_DP_LOBBY_RECONCILE_ENABLED: "true"
      # MGDEMOPLUS_DP_LOBBY_RECONCILE_MS: "60000"
      # DP_NPC_TABLE_TALK_ENABLED: "true"
      # DP_NPC_RULE_THINK_ENABLED: "true"

      # --- A: 方舟 LLM（宿主机 .env 代入）---
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_ENDPOINT_ID: ${ARK_ENDPOINT_ID:-}
      ARK_BASE_URL: ${ARK_BASE_URL:-}
      ARK_REASONING_EFFORT: ${ARK_REASONING_EFFORT:-}
      ARK_THINKING_TYPE: ${ARK_THINKING_TYPE:-}
      ARK_RESPONSE_JSON_OBJECT: ${ARK_RESPONSE_JSON_OBJECT:-true}

      # --- A: OAuth 前后端回跳基址 ---
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
      # --- A: GitHub OAuth ---
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}
      # --- A: Gitee OAuth ---
      GITE_CLIENT_ID: ${GITE_CLIENT_ID:-}
      GITE_CLIENT_SECRET: ${GITE_CLIENT_SECRET:-}
      GITE_REDIRECT_URI: ${GITE_REDIRECT_URI:-}
      # --- A: Ding OAuth ---
      DING_CLIENT_ID: ${DING_CLIENT_ID:-}
      DING_CLIENT_SECRET: ${DING_CLIENT_SECRET:-}
      DING_REDIRECT_URI: ${DING_REDIRECT_URI:-}
      # --- A: JWT（生产公网强烈建议填写；勿写入真实密钥到 Git）---
      JWT_SECRET: ${JWT_SECRET:-}
      EXPERIMENTAL_DECK_PRESET_PASSWORD: ${EXPERIMENTAL_DECK_PRESET_PASSWORD:-}
    volumes:
      - mgdemo_uploads:/data/mgdemo-files
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started


volumes:
  mysql_data:
  redis_data:
  minio_data:
  mgdemo_uploads:
